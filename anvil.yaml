    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6fb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=97bd0907ae">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=4b4f6f288e">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    /* Our web manifest (server_code/Tidy.py: manifest) adds a share target, so the installed app shows up in Android's
       share sheet for tabs, links and screenshots. Anvil adds its own <link rel="manifest">; point it at ours. */
    (function () {
      var href = '_/api/manifest.json';
      function swap() {
        var links = document.querySelectorAll('link[rel="manifest"]');
        if (!links.length) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = href; document.head.appendChild(l); return; }
        links.forEach(function (l, i) { if (i) l.remove(); else if (l.getAttribute('href') !== href) l.setAttribute('href', href); });
      }
      swap();
      document.addEventListener('DOMContentLoaded', swap);
    })();
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.fbInstallPrompt = e; });
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="vef7qyr" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=65344ad6d0">
    <link rel="stylesheet" href="_/theme/app.css?v=8a0d94cfb2">
    <script src="_/theme/app-kit.js?v=09bf12029d"></script>
    <script src="_/theme/fb-engine.js?v=a5bf53d8e9"></script>
    <script src="_/theme/fb-map.js?v=30c74f4db6"></script>
    <script src="_/theme/fb-media.js?v=d9a5dba4fa"></script>
package_name: Faves_Buddy
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/secrets.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
