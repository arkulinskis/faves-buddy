metadata:
  description: Tame your open tabs, map pins, screenshots and ideas. Faves Buddy sorts them for you, shows what is near you
    and finds more you will love.
  logo_img: asset:icon-512.png
  title: 'Faves Buddy: your favourite things, sorted'
name: Faves Buddy
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=3d2d7ae734\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#f4f6fb\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=b0262bd66d\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=b0262bd66d\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=4018064a36\">\n<script src=\"_/theme/app.js?v=ed618113ed\"\
    ></script>\n"
package_name: Faves_Buddy
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
